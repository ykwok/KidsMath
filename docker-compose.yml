version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kidsmath-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kidsmath
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  init:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: builder
    container_name: kidsmath-init
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kidsmath?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "cd apps/server && npx prisma db push --skip-generate && npx ts-node src/seed/seed.ts"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: kidsmath-server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kidsmath?schema=public
      JWT_SECRET: dev-secret-key-change-in-production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      init:
        condition: service_completed_successfully
    command: ["node", "dist/main.js"]

volumes:
  postgres_data:
